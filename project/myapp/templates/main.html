{% extends 'base.html' %}
{% load static %}

{% block content %}

<div style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('{% static 'images/background.png' %}');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -1; 
"></div>

<div class="main-screen-container" style="text-align: center;">
    <h2>Welcome to the Dashboard</h2>
    <div class="button-container" style="margin-top: 20px;">
        <a href="{% url 'reports' %}" class="btn btn-secondary" style="margin: 10px;">View Reports</a>
        <a href="{% url 'payments' %}" class="btn btn-primary" style="margin: 10px;">Manage Payments</a>
    </div>
</div>
{% endblock %}
