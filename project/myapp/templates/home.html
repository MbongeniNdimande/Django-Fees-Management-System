{% extends 'base.html' %}
{% load static %}

{% block content %}

<div style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('{% static 'images/background.png' %}');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -1; 
"></div>

<div class="container d-flex justify-content-center align-items-center" style="height: 80vh;">
    <div class="text-center p-5" style="background-color: rgba(255, 255, 255, 0.8); border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h1>Welcome to the Fees Management System</h1>
        <p class="mb-4">This is the home page of the Django Fees Management System.</p>
        <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Dashboard</a>
    </div>
</div>

{% endblock %}
